# Production overrides, on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds Caddy in front of the API for automatic HTTPS on $DOMAIN, and closes every
# other port: the database and the API are only reachable through Caddy.

services:
  postgres:
    ports: !reset []

  api:
    ports: !reset []

  caddy:
    image: caddy:2
    container_name: boycott-caddy
    restart: unless-stopped
    ports:
      - "80:80"   # needed for the certificate challenge and the HTTP -> HTTPS redirect
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to the API's public hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # certificates: keep this volume or Caddy re-requests them
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
